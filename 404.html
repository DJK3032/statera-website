.nav-links { display:flex; align-items:center; gap:36px; }
.nav-links a { font-size:14px; font-weight:500; color:var(--text-secondary); text-decoration:none; transition:color 0.25s; }
.nav-links a:hover { color:var(--text-primary); }
.nav-cta { padding:10px 24px; background:var(--accent); color:#fff !important; border-radius:6px; font-size:13px; font-weight:600; }
main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px; text-align:center; }
.error-code { font-family:'DM Serif Display',serif; font-size:80px; font-weight:700; background:linear-gradient(135deg,var(--accent),#d4a832); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:16px; }
h1 { font-family:'DM Serif Display',serif; font-size:32px; font-weight:600; color:var(--text-primary); margin-bottom:12px; }
p { font-size:17px; color:var(--text-secondary); max-width:440px; margin:0 auto 32px; line-height:1.7; }
.back-link { display:inline-flex; align-items:center; gap:8px; padding:12px 28px; background:var(--accent); color:#fff; border-radius:8px; font-size:15px; font-weight:600; text-decoration:none; transition:all 0.3s; }
