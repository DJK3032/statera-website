<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent | Statera Solutions</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#0a0a0f; color:#c8c8d0; min-height:100vh; display:flex; flex-direction:column; }
:root { --accent:#bf9525; --text-primary:#eaeaf0; --text-secondary:#9090a0; --border:rgba(255,255,255,0.06); --max-w:1200px; --nav-h:96px; }
nav { height:var(--nav-h); background:rgba(10,10,15,0.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
.nav-inner { width:100%; max-width:var(--max-w); padding:0 40px; display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:14px; font-family:'DM Serif Display',serif; font-size:22px; font-weight:600; color:var(--text-primary); text-decoration:none; }
.logo-mark { width:36px; height:36px; background:linear-gradient(135deg,var(--accent),#d4a832); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'DM Serif Display',serif; font-weight:700; font-size:18px; color:#fff; }
main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px; text-align:center; }
.success-icon { width:64px; height:64px; background:rgba(191,149,37,0.15); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 24px; }
h1 { font-family:'DM Serif Display',serif; font-size:36px; font-weight:600; color:var(--text-primary); margin-bottom:12px; }
p { font-size:17px; color:var(--text-secondary); max-width:480px; margin:0 auto 32px; line-height:1.7; }
.back-link { display:inline-flex; align-items:center; gap:8px; padding:12px 28px; background:var(--accent); color:#fff; border-radius:8px; font-size:15px; font-weight:600; text-decoration:none; transition:all 0.3s; }
.back-link:hover { background:#a6811e; transform:translateY(-2px); }
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo"><img src="logo-dark.svg" alt="Statera Solutions" style="height:72px;width:auto;"></a>
  </div>
</nav>
<main>
  <div>
    <div class="success-icon">✓</div>
    <h1>Message Received</h1>
    <p>Thanks for reaching out. I'll respond within one business day.</p>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
</main>
</body>
</html>
